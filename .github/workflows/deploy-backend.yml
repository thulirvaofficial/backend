name: Thulirva Backend CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy backend
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /var/www/thulirva/backend

            git fetch origin main
            git reset --hard origin/main

            npm install --omit=dev

            echo "=== PM2 STATUS BEFORE ==="
            pm2 status || true

            pm2 restart backend --update-env || pm2 start server.js --name backend --update-env

            pm2 save

            sleep 3

            echo "=== PM2 STATUS AFTER ==="
            pm2 status

            echo "=== PM2 RECENT LOGS ==="
            pm2 logs backend --lines 50 --nostream || true

            echo "=== LISTENING PORTS ==="
            sudo ss -tlpn || sudo netstat -tlpn || true

            echo "=== NGINX CONFIGURATION ==="
            sudo cat /etc/nginx/sites-enabled/* || true

            echo "=== TEST LOCAL BACKEND HTTP ==="
            curl -s -o /dev/null -w "Port 5500 HTTP Code: %{http_code}\n" http://127.0.0.1:5500/api || true
            curl -s -o /dev/null -w "Port 5000 HTTP Code: %{http_code}\n" http://127.0.0.1:5000/api || true

            echo "Backend deployment successful"
