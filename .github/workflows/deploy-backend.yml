name: Thulirva Backend CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy backend
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /var/www/thulirva/backend

            git fetch origin main
            git reset --hard origin/main

            npm install --omit=dev

            pm2 restart backend --update-env || pm2 start server.js --name backend --update-env

            pm2 save

            sleep 3

            sudo bash -c '
              exec > /tmp/diag_out.txt 2>&1
              echo "=== DATE & USER ==="
              date
              whoami
              pwd

              echo "=== LISTENING PORTS ==="
              ss -tlpn

              echo "=== PM2 LIST ==="
              pm2 list || su - ubuntu -c "pm2 list"

              echo "=== PM2 LOGS (last 60 lines) ==="
              pm2 logs backend --lines 60 --nostream || su - ubuntu -c "pm2 logs backend --lines 60 --nostream"

              echo "=== NGINX SITES-ENABLED ==="
              cat /etc/nginx/sites-enabled/*

              echo "=== NGINX ERROR LOG ==="
              tail -n 40 /var/log/nginx/error.log || true

              echo "=== LOCAL CURL TESTS ==="
              curl -s -i http://127.0.0.1:5500/api || echo "Curl 5500 127.0.0.1 failed"
              curl -s -i http://127.0.0.1:5000/api || echo "Curl 5000 127.0.0.1 failed"
              curl -s -i http://localhost:5500/api || echo "Curl 5500 localhost failed"
              curl -s -i http://localhost:5000/api || echo "Curl 5000 localhost failed"
            '

            # Copy diagnostic output to all possible web roots so it can be viewed over HTTP
            sudo cp /tmp/diag_out.txt /var/www/thulirva/website/admin/diag.txt 2>/dev/null || true
            sudo cp /tmp/diag_out.txt /var/www/thulirva/website/website/diag.txt 2>/dev/null || true
            sudo cp /tmp/diag_out.txt /var/www/thulirva/website/diag.txt 2>/dev/null || true
            sudo cp /tmp/diag_out.txt /var/www/html/diag.txt 2>/dev/null || true
            sudo chmod 644 /var/www/thulirva/website/admin/diag.txt /var/www/thulirva/website/website/diag.txt /var/www/thulirva/website/diag.txt /var/www/html/diag.txt 2>/dev/null || true

            cat /tmp/diag_out.txt || true

            echo "Backend deployment successful"
