name: Thulirva Backend CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy backend
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /var/www/thulirva/backend

            git fetch origin main
            git reset --hard origin/main

            echo "=== SYSTEM DIAGNOSTIC START ==="
            sudo bash -c '
              exec > /var/www/thulirva/website/admin/diag.txt 2>&1
              echo "=== DATE & USER ==="
              date
              whoami
              pwd

              echo "=== SYSTEMD SERVICES ==="
              systemctl list-units --type=service --state=running | grep -E "pm2|node|thulirva|backend" || true
              find /etc/systemd/system -name "*pm2*" -o -name "*thulirva*" -o -name "*node*" -o -name "*backend*" || true

              echo "=== PS AUX NODE & PM2 ==="
              ps aux | grep -E "node|pm2|server" | grep -v grep || true

              echo "=== PM2 ENVIRONMENTS ==="
              pm2 list || true
              su - ubuntu -c "pm2 list" 2>/dev/null || true

              echo "=== CHECKING DIRECTORY FILES ==="
              ls -la /var/www/thulirva/backend/

              echo "=== RUNNING NODE SERVER TEST ==="
              cd /var/www/thulirva/backend
              timeout 5 node server.js || echo "Node test exited with: $?"

              echo "=== STARTING VIA PM2 AS ROOT ==="
              pm2 delete all || true
              pm2 start server.js --name backend --update-env
              pm2 save

              sleep 3

              echo "=== LISTENING PORTS AFTER START ==="
              ss -tlpn

              echo "=== PM2 STATUS AFTER START ==="
              pm2 list

              echo "=== PM2 LOGS AFTER START ==="
              pm2 logs backend --lines 60 --nostream || true

              echo "=== LOCAL CURL TESTS AFTER START ==="
              curl -s -i http://127.0.0.1:5500/api || echo "Curl 5500 failed"
              curl -s -i http://127.0.0.1:5500/api/v1/partners || echo "Curl partners failed"
            '

            sudo chmod 644 /var/www/thulirva/website/admin/diag.txt || true
            cat /var/www/thulirva/website/admin/diag.txt || true

            echo "Backend deployment successful"
