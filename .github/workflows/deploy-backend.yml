name: Thulirva Backend CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy backend
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /var/www/thulirva/backend

            git fetch origin main
            git reset --hard origin/main

            npm install --omit=dev

            echo "=== SYSTEM RESTART & VERIFY ==="
            sudo bash -c '
              exec > /var/www/thulirva/website/admin/diag.txt 2>&1
              echo "=== DATE & USER ==="
              date
              whoami

              # Restart in ubuntu user PM2 daemon
              su - ubuntu -c "cd /var/www/thulirva/backend && (pm2 delete backend || true) && pm2 start server.js --name backend --update-env && pm2 save" || true

              # Also restart in root PM2 daemon if running
              (pm2 delete backend || true) && pm2 start /var/www/thulirva/backend/server.js --name backend --update-env && pm2 save || true

              sleep 4

              echo "=== LISTENING PORTS AFTER START ==="
              ss -tlpn

              echo "=== PM2 STATUS (ROOT) ==="
              pm2 list || true

              echo "=== PM2 STATUS (UBUNTU) ==="
              su - ubuntu -c "pm2 list" || true

              echo "=== LOCAL CURL TESTS AFTER START ==="
              curl -s -i http://127.0.0.1:5500/api || echo "Curl 5500 failed"
              curl -s -i http://127.0.0.1:5500/api/v1/partners || echo "Curl partners failed"
            '

            sudo chmod 644 /var/www/thulirva/website/admin/diag.txt || true
            cat /var/www/thulirva/website/admin/diag.txt || true

            echo "Backend deployment successful"
