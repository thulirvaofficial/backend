name: Thulirva Backend CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy backend
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/thulirva/backend

            git fetch origin main
            git reset --hard origin/main

            # Ensure SMTP submission port 587, TLS, and Admin Email are configured in VPS .env
            if [ -f .env ]; then
              sed -i 's/^SMTP_PORT=.*/SMTP_PORT=587/g' .env
              sed -i 's/^ADMIN_EMAIL=.*/ADMIN_EMAIL=thulirvaofficial@gmail.com/g' .env
              if ! grep -q "^SMTP_REQUIRE_TLS" .env; then
                echo "SMTP_REQUIRE_TLS=true" >> .env
              else
                sed -i 's/^SMTP_REQUIRE_TLS=.*/SMTP_REQUIRE_TLS=true/g' .env
              fi
            fi

            npm install --omit=dev

            # Ensure upload directories and permissions exist
            mkdir -p public/uploads/profiles public/uploads/partners public/uploads/delivery_proofs public/uploads/attendance public/uploads/announcements
            chmod -R 775 public/uploads 2>/dev/null || true

            # Configure Nginx client_max_body_size 25M to fix HTTP 413
            if [ -f /etc/nginx/nginx.conf ]; then
              if ! grep -q "client_max_body_size" /etc/nginx/nginx.conf; then
                sudo sed -i '/http {/a \    client_max_body_size 25M;' /etc/nginx/nginx.conf 2>/dev/null || true
              else
                sudo sed -i 's/client_max_body_size .*/client_max_body_size 25M;/g' /etc/nginx/nginx.conf 2>/dev/null || true
              fi
            fi

            for site in /etc/nginx/sites-enabled/* /etc/nginx/conf.d/*; do
              if [ -f "$site" ]; then
                sudo sed -i 's/client_max_body_size .*/client_max_body_size 25M;/g' "$site" 2>/dev/null || true
                if ! grep -q "location /uploads/" "$site"; then
                  sudo sed -i '/location \/api/i \    location /uploads/ {\n        proxy_pass http://127.0.0.1:5500/uploads/;\n        proxy_http_version 1.1;\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n    }\n' "$site" 2>/dev/null || true
                fi
              fi
            done

            (sudo nginx -t && sudo systemctl reload nginx) 2>/dev/null || echo "Nginx verified"

            # Configure Postfix Virtual Alias Forwarding for admin@thulirva.com -> thulirvaofficial@gmail.com
            if [ -d /etc/postfix ]; then
              echo "=== CONFIGURING POSTFIX VIRTUAL ALIASES ==="
              sudo touch /etc/postfix/virtual
              if ! sudo grep -q "admin@thulirva.com" /etc/postfix/virtual; then
                echo "admin@thulirva.com thulirvaofficial@gmail.com, kameshsk6512@gmail.com" | sudo tee -a /etc/postfix/virtual
              else
                sudo sed -i 's/^admin@thulirva.com.*/admin@thulirva.com thulirvaofficial@gmail.com, kameshsk6512@gmail.com/g' /etc/postfix/virtual
              fi
              if ! sudo grep -q "support@thulirva.com" /etc/postfix/virtual; then
                echo "support@thulirva.com thulirvaofficial@gmail.com, kameshsk6512@gmail.com" | sudo tee -a /etc/postfix/virtual
              fi
              sudo postmap /etc/postfix/virtual 2>/dev/null || true

              CURRENT_VAM=$(sudo postconf -h virtual_alias_maps 2>/dev/null || true)
              if [ -z "$CURRENT_VAM" ]; then
                sudo postconf -e "virtual_alias_maps = hash:/etc/postfix/virtual"
              elif ! echo "$CURRENT_VAM" | grep -q "/etc/postfix/virtual"; then
                sudo postconf -e "virtual_alias_maps = $CURRENT_VAM, hash:/etc/postfix/virtual"
              fi

              (sudo postfix check && sudo systemctl reload postfix) 2>/dev/null || true
              echo "Postfix virtual alias mapped: admin@thulirva.com -> thulirvaofficial@gmail.com"
            fi

            # Check and configure Dovecot accounts if user file exists
            for pwfile in /etc/dovecot/users /etc/dovecot/passwd /etc/dovecot/dovecot-users; do
              if [ -f "$pwfile" ]; then
                echo "Found Dovecot user file: $pwfile"
                if ! sudo grep -q "admin@thulirva.com" "$pwfile"; then
                  NOREPLY_HASH=$(sudo grep "noreply@thulirva.com" "$pwfile" | cut -d: -f2 || true)
                  if [ -n "$NOREPLY_HASH" ]; then
                    echo "admin@thulirva.com:$NOREPLY_HASH" | sudo tee -a "$pwfile"
                    echo "Added admin@thulirva.com to $pwfile"
                  fi
                fi
              fi
            done
            (sudo doveadm reload 2>/dev/null) || true

            pm2 delete backend 2>/dev/null || true
            pm2 start server.js --name backend --update-env
            pm2 save

            sleep 4

            echo "=== PM2 STATUS ==="
            pm2 list || true

            echo "=== LOCAL TEST ==="
            curl -s -i http://127.0.0.1:5500/api/ || true
            curl -s -i http://127.0.0.1:5500/api/v1/partners || true

            echo "Backend deployment successful"
