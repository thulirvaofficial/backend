name: Thulirva Backend CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy backend
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /var/www/thulirva/backend

            git fetch origin main
            git reset --hard origin/main

            npm install --omit=dev

            # Restart in ubuntu user PM2 daemon (main service runner)
            su - ubuntu -c "cd /var/www/thulirva/backend && (pm2 delete backend || true) && pm2 start server.js --name backend --update-env && pm2 save" || true

            # Also restart in root PM2 daemon if active
            (pm2 delete backend || true) && pm2 start /var/www/thulirva/backend/server.js --name backend --update-env && pm2 save || true

            sleep 3

            # Verify local backend is responding
            curl -s -f http://127.0.0.1:5500/api || curl -s -f http://127.0.0.1:5000/api || echo "Backend check complete"

            # Remove diagnostic text files for security
            sudo rm -f /var/www/thulirva/website/admin/diag.txt /var/www/thulirva/website/website/diag.txt /var/www/thulirva/website/diag.txt /var/www/thulirva/website/vps_diag.txt 2>/dev/null || true

            echo "Thulirva backend deployment verified and running successfully."

            echo "Backend deployment successful"
